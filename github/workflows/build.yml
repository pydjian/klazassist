name: Node.js Build

on:
  push:
    branches: [ main ] # Triggers the build on every push to the main branch
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Specify your preferred Node version

    - name: Install dependencies
      run: npm ci # Safer and faster than 'npm install' for automated environments

    - name: Run build script
      run: npm run build --if-present
